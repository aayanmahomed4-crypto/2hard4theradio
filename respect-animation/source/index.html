<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Nunito"; src: url("nunito-latin-wght-normal.woff2") format("woff2"); font-weight: 200 1000; font-style: normal; }
@font-face { font-family: "Nunito"; src: url("nunito-latin-wght-italic.woff2") format("woff2"); font-weight: 200 1000; font-style: italic; }
html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
#frame { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Nunito", sans-serif; }
#stage { position: absolute; inset: 0; }
#ui { position: absolute; inset: 0; pointer-events: none; }
.cap { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); width: max-content; max-width: 1540px; box-sizing: border-box; display: flex; align-items: center; gap: 22px;
  background: rgba(17, 20, 44, 0.88); color: #fff; border-radius: 30px; padding: 22px 34px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.cap .who { flex: none; font-weight: 900; font-size: 26px; letter-spacing: 2px; padding: 8px 18px; border-radius: 999px; color: #fff; }
.cap .txt { font-weight: 700; font-size: 42px; line-height: 1.22; }
.cap.narr .who { background: #fff; color: #11142C; }
.cap.narr .txt { font-style: italic; font-weight: 600; }
.dim { position: absolute; inset: 0; background: rgba(17, 20, 44, 0.55); }
.card { position: absolute; left: 50%; transform-origin: 50% 50%; background: #fff; border-radius: 40px; box-shadow: 0 24px 70px rgba(0,0,0,.30);
  color: #11142C; padding: 44px 64px; box-sizing: border-box; }
.card h1 { margin: 0; font-weight: 1000; font-size: 76px; letter-spacing: 1px; line-height: 1.05; }
.card h2 { margin: 0; font-weight: 900; font-size: 50px; line-height: 1.1; }
.bul { display: flex; align-items: center; gap: 24px; font-size: 44px; font-weight: 800; margin-top: 26px; }
.tick { flex: none; width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.tick svg { width: 30px; height: 30px; fill: #fff; }
.formula { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 18px 22px; margin-top: 22px; }
.chip { font-weight: 1000; font-size: 46px; padding: 14px 30px; border-radius: 999px; color: #fff; }
.plus { font-weight: 1000; font-size: 54px; color: #11142C; }
.iconrow { display: flex; justify-content: center; gap: 44px; margin-top: 34px; }
.ico { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 260px; text-align: center; font-weight: 800; font-size: 32px; line-height: 1.15; }
.ico .disc { width: 128px; height: 128px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.ico .disc svg { width: 64px; height: 64px; fill: #fff; }
.steps { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 36px; }
.step { display: flex; flex-direction: column; align-items: center; gap: 14px; font-weight: 900; font-size: 40px; width: 240px; }
.step .disc { width: 138px; height: 138px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.step .disc svg { width: 70px; height: 70px; fill: #fff; }
.arrow { font-size: 64px; font-weight: 1000; color: #11142C; margin-bottom: 56px; }
.flag { position: absolute; display: flex; align-items: center; gap: 26px; background: #fff; border-radius: 30px; padding: 26px 34px; box-sizing: border-box;
  color: #11142C; font-weight: 900; font-size: 38px; line-height: 1.15; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
.flag .disc { flex: none; width: 92px; height: 92px; border-radius: 50%; background: #E5484D; display: flex; align-items: center; justify-content: center; }
.flag .disc svg { width: 50px; height: 50px; fill: #fff; }
.bigtitle { position: absolute; left: 0; right: 0; text-align: center; color: #fff; font-weight: 1000; }
.fade { position: absolute; inset: 0; background: #0B0D1C; }
.flash { position: absolute; inset: 0; background: #fff; }
.pause { position: absolute; left: 60px; top: 56px; display: flex; align-items: center; gap: 16px; background: rgba(17,20,44,.85); color: #fff;
  padding: 14px 26px 14px 20px; border-radius: 999px; font-weight: 900; font-size: 28px; letter-spacing: 2px; }
.pause svg { width: 30px; height: 30px; fill: #fff; }
</style>
</head>
<body>
<div id="frame">
  <svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="ui"></div>
</div>
<script src="icons.js"></script>
<script src="anim.js"></script>
</body>
</html>
